stores:
    atuin:
        target: ~/.config/atuin
        files:
            - config.toml
    dms:
        target: ~/.config/DankMaterialShell
        files:
            - settings.json
        when:
            distro: CachyOS
    eza:
        target: ~/.config/eza
        files:
            - theme.yml
    gitconfig:
        target: "~"
        files:
            - .gitconfig
    helix:
        target: ~/.config/helix
        files:
            - config.toml
            - languages.toml
            - rfvh
            - yazi-picker.sh
            - themes/pop-dark_oscar.toml
    input-remapper-2:
        target: ~/.config/input-remapper-2
    lazygit:
        target: ~/.config/lazygit
        files:
            - config.yml
    localbin:
        target: ~/.local/bin
        files:
            - yazi-picker_fromyazi.sh
            - yaziii.sh
            - gopass_clipboard_copy_cmd.sh
            - gopass_clipboard_clear_cmd.sh
            - svnlog
            - svnst
            - svnup
    niri:
        target: ~/.config/niri
        files:
            - config.kdl
            - mybinds.kdl
            - myrules.kdl
            - myws.kdl
            - mybinds_noctalia5.kdl
            - noctalia.kdl
    rio:
        target: ~/.config/rio
        files:
            - config.toml
            - themes/Gruvbox_Material_Dark.toml
            - themes/noctalia.toml

    systemdvars:
        target: ~/.config/environment.d
        files:
            - gopass.conf
    television:
        target: ~/.config/television
        files:
            - config.toml
            - cable/secondbrain.toml
    vicinae:
        target: ~/.config/vicinae
        files:
            - settings.json
    wezterm:
        target: ~/.config/wezterm
        files:
            - bg.jpg
            - over.png
            - wezterm.lua
            - wp46.jpg
            - wpaperture.jpg
            - wpl1.jpg
            - wpl2.jpg
            - wpl3.jpg
            - colors/dank-theme.toml
        when:
            distro: CachyOS
    yazi:
        targets:
            - target: ~/.config/yazi
              files:
                - init.lua
                - keymap.toml
                - package.toml
                - theme.toml
                - yazi.toml
            - target: ~/.config/yazi-alt
              files:
                - init.lua
                - package.toml
                - theme.toml
    yazi-alt:
        target: ~/.config/yazi-alt
        files:
            - keymap.toml
            - yazi.toml
    zathurarc:
        target: ~/.config/zathura
        files:
            - zathurarc
    zellij:
        target: ~/.config/zellij
        files:
            - config.kdl
            - layouts/newr.kdl
            - layouts/rustdev.kdl
            - layouts/stacked.kdl
            - layouts/tall.kdl
            - layouts/uni.kdl
            - layouts/newstack.kdl
    zsh:
        target: "~"
        files:
            - .zshrc
            - .p10k.zsh
            - aliases.zsh

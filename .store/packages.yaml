packages:
    core: 
        pacman: [atuin, eza, duf,  yazi, git-delta, intelli-shell, lazygit, pass, python-pip, python-pipx, skm, restic, scooter, stow, zoxide, zellij, dra, television, gopass, khal, github-cli, diffnav ] 
        when: {distro: [CachyOS]}
    core-deb:
        brew: [helix,yazi, git-delta, atuin, eza, duf,  intelli-shell, lazygit, pass,   restic, scooter, stow, zoxide, pipx, dra, television, gopass  ] 
        apt: [fonts-hack, input-remapper, wl-clipboard, ddgr, pass, python-is-python3, nvtop]
        go: ['github.com/TimothyYe/skm/cmd/skm']
        pipx: [tldr, ruff, jedi-language-server]
        cargo:
          - zellij
        when: {distro: [debian, ubuntu]}
    gui-linux:
        pacman: [browserpass, browserpass-chromium, google-chrome, helium-browser-bin, nautilus,nautilus-open-any-terminal, vicinae-bin, wezterm, wayvnc]
        when: {distro: [CachyOS]}
    gui-linux_ubuntu:
        apt: [wl-clipboard]
        when: {distro: [ubuntu]}

    withdocking:
        pacman: [ddcutil, displaylink, i2c-tools]
        when: {distro: [CachyOS]}
    deving:
        pacman: [docker, docker-compose]
        npm: ['@google/gemini-cli']
        go: ['golang.org/x/tools/gopls@latest', 'github.com/xaaha/hulak@latest']
        when: {distro: [CachyOS]}
    deving_deb:
        go:
          - 'golang.org/x/tools/gopls@latest'
          - 'github.com/xaaha/hulak@latest'
          - 'github.com/netmute/ctags-lsp@latest'
          - 'github.com/sqlc-dev/sqlc/cmd/sqlc@latest'
          - 'github.com/air-verse/air@latest'
          - 'github.com/swaggo/swag/cmd/swag@latest'
        cargo: ['hx-lsp','sleek']
        when: {distro: [ubuntu]}
    
        
    

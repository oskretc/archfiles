[global]
target = "~/.local/bin"

["zyedidia/micro"]
upgrade_only = false
show_hash = true
asset_filters = ["static", ".tar.gz", "^.tar.gz.sha"]
target = "~/.local/bin/micro"

["gopasspw/gopass"]
upgrade_only = false
show_hash = true
asset_filters = [".tar.gz", "^.tar.gz.sbom.json"]

["KingDasWinx/Dexo"]
upgrade_only = false
show_hash = true
asset_filters = ["x86_64", ".tar.gz", "^.tar.gz.sha256"]
file = "dexo"

["metaory/treg"]
upgrade_only = false
show_hash = true
asset_filters = ["x86_64", ".tar.gz", "^.sha256"]
file = "treg"

["drewzemke/tongo"]
upgrade_only = false
show_hash = true
asset_filters = ["x86_64", ".tar.gz", "musl", "^.sha256"]
file = "tongo"

["epistates/treemd"]
upgrade_only = false
show_hash = true
asset_filters = ["x86_64", ".tar.gz", "musl", "^.sha256"]
file = "treemd-x86_64-unknown-linux-musl"
target = "~/.local/bin/treemd"

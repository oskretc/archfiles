# theme = "monokai_aqua"
# theme = "tokyonight"
# theme = "dark_plus_oscar"
# theme = "pop-dark_oscar"
theme = "noctalia"

[editor]
line-number = "absolute"
jump-label-alphabet = "ntesirmghdlpuf"

[editor.lsp]
[editor.lsp.code-lenses]
enable = true

[editor.spelling]
# languages = ["en_US"]
min-word-length = 4

[editor.breadcrumb]
enable = true
path = "full"

[editor.clipboard]
provider = "wayland"

[editor.rainbow-brackets]
enable = true

[editor.gutters]
layout = ["diagnostics", "spacer", "line-numbers", "spacer", "diff", "spacer", "code-action-hint"]

[editor.diagnostics.inline]
# cursor-line = "error"
cursor-line = "hint"
prefix-len = 10

other-lines = "warning"

[editor.diagnostics.end-of-line]
# popup-border = "all"
# rulers = [120]

severity = "hint"

[editor.bufferline]
show = "always"

[editor.file-picker]
hidden = false

[editor.soft-wrap]
enable = false

[editor.indent-guides]
render = true
character = "⸽"
skip-levels = 1

[editor.cursor.shape]
normal = "block"
insert = "bar"
select = "underline"

[editor.completion.path]
enable = false

[editor.statusline]
left = ["mode", "spinner", "separator", "file-absolute-path", "separator", "branch"]
# center = ["file-name"]
right = ["separator", "diagnostics", "selections", "position", "file-encoding", "file-line-ending", "file-type"]
# right = ["code-action-hint", "separator", "diagnostics", "selections", "position", "file-encoding", "file-line-ending", "file-type"]
separator = "|"

mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"
mode.color = true

[editor.mouse]
enable = true

[keys.normal]
"Y" = ":clipboard-yank"
space.n = "buffer_picker"
"C-g" = [":new", ":insert-output lazygit", ":buffer-close!", ":redraw"]

# for colemak
"m" = "move_char_left"
"n" = "move_visual_line_down"
"e" = "move_visual_line_up"
"i" = "move_char_right"
"l" = "move_next_word_end"
"L" = "move_next_long_word_end"
"j" = "insert_mode"
"J" = "insert_at_line_start"
"k" = "search_next"
"K" = "search_previous"

# delete from cursor to end of line
"D" = ["extend_to_line_end", "delete_selection"]

# F2 = [":write lazysql.sql", ":sh sqlrun.sh"]
# C-e = ":sh ~/.config/helix/sqlrun.sh"
C-n = "@hiw*/<up><ret>"  # find the next word under the cursor
C-y = ":sh zellij run -c -f -x 10%% -y 10%% --width 80%% --height 80%% -- bash ~/.config/helix/yazi-picker.sh open"
C-k = ":sh zellij run -c -f -x 10%% -y 10%% --width 80%% --height 80%% -- bash ~/.config/helix/rfvh open"
C-l = ":sh zellij run -c -f --width 80%% --height 80%% -- lazygit"
C-t = ":sh zellij action toggle-floating-panes"
C-s = [":write"]
C-b = ["save_selection"]
ret = ["goto_word"]
d = "delete_selection_noyank"
# A-d = "delete_selection"
# c = "change_selection_noyank"
# A-c = "change_selection"
C-space = "insert_at_line_end"

S-down = ["extend_to_line_bounds", "delete_selection", "paste_after"]
S-up = ["extend_to_line_bounds", "delete_selection", "move_line_up", "paste_before"]

[keys.normal.tab]
label = "Tab mode"
m = ":buffer-previous"
i = ":buffer-next"
c = ":bc"
r = ":reload"
w = { label = "Goto next split", command = "@<space>ww" }

# for colemak
[keys.normal."h"]
label = "Match"
"m" = "match_brackets"
"s" = "surround_add"
"r" = "surround_replace"
"d" = "surround_delete"
"a" = "select_textobject_around"
"i" = "select_textobject_inner"

[keys.normal."h".e]
label = "Common Used"
u = { label = "Match inside double quotes", command = "@hi\"" }
U = { label = "Match outside double quotes", command = "@ha\"" }
c = { label = "Match inside curly brackets", command = "@ha{" }

# for colemak

[keys.normal.";"]
label = "Commands"
q = ":q!"
w = { label = "Toggle wrap word", command = ":toggle soft-wrap.enable" }
# splits the current window with the same file at the same location and goes to definition
d = { label = "Goto Definition in split view", command = "@<space>wvgd" }
# close the curret split, if no splits, it quits
p = { label = "Close split view", command = "@<space>wq" }
a = { label = "Suggest doc with claude", command = ":insert-output suggest_doc.sh %{current_working_directory} %{file_path_absolute} %{cursor_line}" }
s = "snippet_picker"
x = { label = "File outline", command = ":insert-output %sh_interactive{makeselector.sh}" }
j = { label = "Just chooser", command = ":sh %sh_interactive{just --choose}" }

m = [":noop %sh_interactive{lazygit}"]

[keys.normal.";".c]
label = "Configuration"
o = { label = "Open", command = ":config-open" }
r = { label = "Reload", command = ":config-reload" }
l = { label = "Open Languages", command = ":o ~/.config/mitos/languages.toml" }

[keys.normal.g]
v = "jump_backward"
n = { label = "Find next word under the cursor", command = "@hiw*/<up><ret>" }  # find the next word under the cursor

[keys.insert]
C-s = ["normal_mode", ":write"]
C-space = "normal_mode"

F2 = [":write", ":sh sqlrun.sh"]

[keys.select]
"m" = "extend_char_left"
"n" = "extend_visual_line_down"
"e" = "extend_visual_line_up"
"i" = "extend_char_right"
"l" = "extend_next_word_end"
"j" = "insert_mode"
"J" = "insert_at_line_start"
"k" = "extend_search_next"
"K" = "extend_search_previous"

# args = ["--"]
[keys.select."h"]
label = "Match"
"m" = "match_brackets"
"s" = "surround_add"
"r" = "surround_replace"
"d" = "surround_delete"
"a" = "select_textobject_around"
"i" = "select_textobject_inner"

[keys.select."h".e]
label = "Common Used"
u = { label = "Match inside double quotes", command = "@hi\"" }
U = { label = "Match outside double quotes", command = "@ha\"" }
c = { label = "Match inside curly brackets", command = "@ha{" }

[terminal]
true-color = true

[terminal.launcher]
command = "zellij"

[ui]
theme = "TokyoNight"
code_theme = "base16-ocean.dark"
outline_width = 20
tree_style = "compact"
outline_heading_markers = true

[terminal]
color_mode = "auto"
warned_terminal_app = false

[theme]

[keybindings.CommandPalette]
e = "CommandPalettePrev"
n = "CommandPaletteNext"

[keybindings.Interactive]
n = "InteractiveNext"
K = "PrevMatch"
o = "OpenInEditor"
e = "InteractivePrevious"
j = "ExitInteractiveMode"
k = "NextMatch"

[keybindings.DocSearch]
e = "ScrollUp"
k = "NextMatch"
K = "PrevMatch"
n = "ScrollDown"

[keybindings.Help]
e = "HelpScrollUp"
n = "HelpScrollDown"

[keybindings.InteractiveTable]
i = "InteractiveRight"
n = "InteractiveNext"
m = "InteractiveLeft"
e = "InteractivePrevious"

[keybindings.Normal]
K = "PrevMatch"
k = "NextMatch"
";" = "SetBookmark"
P = "JumpToParent"
m = "Collapse"
o = "OpenInEditor"
e = "Previous"
n = "Next"
j = "EnterInteractiveMode"
i = "Expand"
p = "OpenFilePicker"

[keybindings.LinkFollow]
n = "NextLink"
e = "PreviousLink"

[keybindings.FilePicker]
n="Next"
e="Previous"
# [keybindings.ImageViewer]
# m="PreviousFrame"
# i="NextFrame"

[editor]

[images]
enabled = true

[content]
hide_frontmatter = true
hide_latex = true
latex_aggressive = true
code_fences = "full"

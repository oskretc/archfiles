[ui]
theme = "OceanDark"
code_theme = "base16-ocean.dark"
outline_width = 20
tree_style = "compact"
outline_heading_markers = true

[terminal]
color_mode = "auto"
warned_terminal_app = false

[theme]

[keybindings.Normal]
p = "OpenFilePicker"
o = "OpenInEditor"
P = "JumpToParent"
m = "Collapse"
M = "SetBookmark"
n = "Next"
e = "Previous"
i = "Expand"
j= "EnterInteractiveMode"


[editor]

[images]
enabled = true

[content]
hide_frontmatter = true
hide_latex = true
latex_aggressive = true
code_fences = "full"

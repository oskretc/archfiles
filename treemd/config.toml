[ui]
theme = "OceanDark"
code_theme = "base16-ocean.dark"
outline_width = 20
tree_style = "compact"
outline_heading_markers = true

[terminal]
color_mode = "auto"
warned_terminal_app = false

[theme]

[keybindings.CommandPalette]
n = "CommandPaletteNext"
e = "CommandPalettePrev"

[keybindings.LinkFollow]
n = "NextLink"
e = "PreviousLink"

[keybindings.Help]
e = "HelpScrollUp"
n = "HelpScrollDown"

[keybindings.FilePicker]
e = "Previous"
n = "Next"

[keybindings.Interactive]
k = "NextMatch"
e = "InteractivePrevious"
j = "ExitInteractiveMode"
n = "InteractiveNext"
o = "OpenInEditor"
K = "PrevMatch"

[keybindings.DocSearch]
K = "PrevMatch"
k = "NextMatch"
e = "ScrollUp"
n = "ScrollDown"

[keybindings.Normal]
p = "OpenFilePicker"
";" = "SetBookmark"
e = "Previous"
i = "Expand"
P = "JumpToParent"
K = "PrevMatch"
n = "Next"
j = "EnterInteractiveMode"
o = "OpenInEditor"
k = "NextMatch"
m = "Collapse"

[keybindings.InteractiveTable]
m = "InteractiveLeft"
n = "InteractiveNext"
e = "InteractivePrevious"
i = "InteractiveRight"

[editor]

[images]
enabled = true

[content]
hide_frontmatter = true
hide_latex = true
latex_aggressive = true
code_fences = "full"

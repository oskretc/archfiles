[ui]
theme = "TokyoNight"
code_theme = "base16-ocean.dark"
outline_width = 20
tree_style = "compact"
outline_heading_markers = true

[terminal]
color_mode = "auto"
warned_terminal_app = false

[theme]

[keybindings.Normal]
n = "Next"
o = "OpenInEditor"
p = "OpenFilePicker"
m = "Collapse"
e = "Previous"
k = "NextMatch"
";" = "SetBookmark"
P = "JumpToParent"
j = "EnterInteractiveMode"
i = "Expand"
K = "PrevMatch"

[keybindings.Help]
n = "HelpScrollDown"
e = "HelpScrollUp"
[keybindings.Interactive]
j = "ExitInteractiveMode"
n = "InteractiveNext"
e = "InteractivePrevious"
k = "NextMatch"
K = "PrevMatch"


[editor]

[images]
enabled = true

[content]
hide_frontmatter = true
hide_latex = true
latex_aggressive = true
code_fences = "full"

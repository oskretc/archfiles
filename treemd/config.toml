[ui]
theme = "Monokai"
code_theme = "base16-ocean.dark"
outline_width = 20
tree_style = "compact"
outline_heading_markers = true

[terminal]
color_mode = "auto"
warned_terminal_app = false

[theme]

[keybindings.Normal]
n = "Next"
j = "EnterInteractiveMode"
";" = "SetBookmark"
P = "JumpToParent"
o = "OpenInEditor"
m = "Collapse"
i = "Expand"
k = "NextMatch"
K = "PrevMatch"
p = "OpenFilePicker"
e = "Previous"

[editor]

[images]
enabled = true

[content]
hide_frontmatter = true
hide_latex = true
latex_aggressive = true
code_fences = "full"

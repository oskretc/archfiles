[ui]
theme = "CatppuccinMocha"
code_theme = "base16-ocean.dark"
outline_width = 20
tree_style = "compact"
outline_heading_markers = true

[terminal]
color_mode = "auto"
warned_terminal_app = false

[theme]

[keybindings.Interactive]
k = "NextMatch"
n = "InteractiveNext"
e = "InteractivePrevious"
j = "ExitInteractiveMode"
K = "PrevMatch"
o= "OpenInEditor"
[keybindings.InteractiveTable]
m="InteractiveLeft"
n="InteractiveNext"
e="InteractivePrevious"
i="InteractiveRight"


[keybindings.Normal]
";" = "SetBookmark"
P = "JumpToParent"
i = "Expand"
n = "Next"
e = "Previous"
K = "PrevMatch"
j = "EnterInteractiveMode"
m = "Collapse"
o = "OpenInEditor"
p = "OpenFilePicker"
k = "NextMatch"

[keybindings.Help]
n = "HelpScrollDown"
e = "HelpScrollUp"

[editor]

[images]
enabled = true

[content]
hide_frontmatter = true
hide_latex = true
latex_aggressive = true
code_fences = "full"

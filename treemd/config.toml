[ui]
theme = "OceanDark"
code_theme = "base16-ocean.dark"
outline_width = 20
tree_style = "compact"
outline_heading_markers = true

[terminal]
color_mode = "auto"
warned_terminal_app = false

[theme]

[keybindings.DocSearch]
k = "NextMatch"
K = "PrevMatch"
n = "ScrollDown"
e = "ScrollUp"

[keybindings.LinkFollow]
n = "NextLink"
e = "PreviousLink"

[keybindings.FilePicker]
e = "Previous"
n = "Next"

[keybindings.Help]
n = "HelpScrollDown"
e = "HelpScrollUp"

[keybindings.InteractiveTable]
i = "InteractiveRight"
e = "InteractivePrevious"
m = "InteractiveLeft"
n = "InteractiveNext"

[keybindings.CommandPalette]
n = "CommandPaletteNext"
e = "CommandPalettePrev"

[keybindings.Normal]
i = "Expand"
n = "Next"
K = "PrevMatch"
k = "NextMatch"
j = "EnterInteractiveMode"
";" = "SetBookmark"
m = "Collapse"
p = "OpenFilePicker"
P = "JumpToParent"
e = "Previous"
o = "OpenInEditor"

[keybindings.Interactive]
K = "PrevMatch"
k = "NextMatch"
o = "OpenInEditor"
n = "InteractiveNext"
e = "InteractivePrevious"
j = "ExitInteractiveMode"

[editor]

[images]
enabled = true

[content]
hide_frontmatter = true
hide_latex = true
latex_aggressive = true
code_fences = "full"

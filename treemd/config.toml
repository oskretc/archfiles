[ui]
theme = "Gruvbox"
code_theme = "base16-ocean.dark"
outline_width = 20
tree_style = "compact"
outline_heading_markers = true

[terminal]
color_mode = "auto"
warned_terminal_app = false

[theme]

[keybindings.Normal]
e = "Previous"
K = "SetBookmark"
o = "OpenInEditor"
n = "Next"
i = "Expand"
j = "EnterInteractiveMode"
P = "JumpToParent"
m = "Collapse"
p = "OpenFilePicker"

[editor]

[images]
enabled = true

[content]
hide_frontmatter = true
hide_latex = true
latex_aggressive = true
code_fences = "full"

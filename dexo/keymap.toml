
[global]
"space r" = "focus.results"
"space e" = "focus.editor"
"space s" = "focus.explorer"
"space t" = "focus.tabs"
"?" = "help.open"
"; q" = "workbench.quit"
"; l" = "layout.cycle"
"tab m" = "document.prev"
"tab i" = "document.next"
"tab tab" = "focus.tabs"

[vim]
"m" = "h"
"n" = "j"
"e" = "k"
"i" = "l"
"j" = "i"

[results]
